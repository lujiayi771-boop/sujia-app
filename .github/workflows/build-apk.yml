name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare www directory
        run: |
          pwd
          ls -la
          if [ -d "www" ]; then
            echo "www directory already exists"
          elif [ -d "WWW" ]; then
            cp -r WWW www
            echo "copied WWW to www"
          else
            echo "ERROR: neither www nor WWW found in repository root"
            exit 1
          fi
          echo "--- www contents ---"
          ls -la www

      - name: Add plugins
        run: |
          cordova plugin add cordova-plugin-file@7.0.0
          cordova plugin add cordova-plugin-local-notification
          cordova plugin add cordova-plugin-media

      - name: Build Android APK
        run: |
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suijia-apk
          path: platforms/android/app/build/outputs/apk/**/*.apk
