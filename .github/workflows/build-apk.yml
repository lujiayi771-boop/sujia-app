name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare www and icon
        env:
          ICON_B64: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
        run: |
          [ -d WWW ] && [ ! -d www ] && cp -r WWW www || true
          mkdir -p www
          [ -f index.html ] && cp -f index.html www/index.html || true
          [ -f sw.js ] && cp -f sw.js www/sw.js || true
          [ ! -f www/icon.png ] && echo "$ICON_B64" | base64 -d > www/icon.png || true
          ls -la www

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Strip plugin declarations
        run: sed -i '/<plugin name=/d' config.xml

      - name: Add Android platform
        run: cordova platform add android

      - name: Install plugins
        run: |
          cordova plugin add cordova-plugin-local-notification
          cordova plugin add cordova-plugin-file@^8.0.0
          cordova plugin add cordova-plugin-media@^7.0.0 --force
          cordova plugin add https://github.com/latchuk/cordova-plugin-saf-mediastore.git

      - name: Dedupe duplicate permissions
        run: f="platforms/android/app/src/main/AndroidManifest.xml"; if [ -f "$f" ]; then python3 -c "import re; p='platforms/android/app/src/main/AndroidManifest.xml'; t=open(p,encoding='utf-8').read(); s=set(); t=re.sub(r'<uses-permission android:name=\"([^\"]+)\"[^>]*/>', lambda m: '' if m.group(1) in s else (s.add(m.group(1)) or m.group(0)), t); open(p,'w',encoding='utf-8').write(t)"; fi

      - name: Build Debug APK
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suijia-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
