name: Build APK

# 触发方式：推送到 main 分支，或在 Actions 页面手动点 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 把大写 WWW 目录归一化为 Cordova 只认的小写 www，并在缺图标时生成占位图标
      - name: Prepare www and icon
        env:
          ICON_B64: ""
        run: |
          set -e
          if [ -d WWW ] && [ ! -d www ]; then cp -r WWW www; fi
          if [ ! -d www ]; then mkdir -p www; fi
          if [ -f index.html ]; then cp -f index.html www/index.html; fi
          if [ -f sw.js ]; then cp -f sw.js www/sw.js; fi
          if [ ! -f www/icon.png ]; then echo "$ICON_B64" | base64 -d > www/icon.png; fi
          echo "--- www ---"
          ls -la www

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      # 先删掉 config.xml 里的 <plugin .../> 声明，避免 platform add 还原插件时版本冲突
      - name: Strip plugin declarations in config.xml
        run: |
          sed -i '/<plugin /d' config.xml
          grep -c "<plugin" config.xml || true

      - name: Add Android platform
        run: cordova platform add android

      - name: Install plugins
        run: |
          cordova plugin add cordova-plugin-local-notification || true
          cordova plugin add cordova-plugin-file@^8.0.0 || true
          cordova plugin add cordova-plugin-media@^7.0.0 --force || true
          cordova plugin add https://github.com/latchuk/cordova-plugin-saf-mediastore.git || true

      # 去掉 AndroidManifest 里重复的 <uses-permission>（按权限名去重，避免清单合并报错）
      - name: Dedupe manifest permissions
        run: |
          for MANIFEST in $(find platforms/android -name AndroidManifest.xml); do
            awk '/uses-permission[^>]*android:name=/ { if (match($0, /android:name="[^"]*"/)) { k=substr($0, RSTART, RLENGTH); if (seen[k]++) next } } { print }' "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
          done

      - name: Build Debug APK
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suijia-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
