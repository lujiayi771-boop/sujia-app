name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare www and icon
        env:
          ICON_B64: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
        run: |
          set -e
          if [ -d WWW ] && [ ! -d www ]; then cp -r WWW www; fi
          if [ ! -d www ]; then mkdir -p www; fi
          if [ -f index.html ]; then cp -f index.html www/index.html; fi
          if [ -f sw.js ]; then cp -f sw.js www/sw.js; fi
          if [ ! -f www/icon.png ]; then echo "$ICON_B64" | base64 -d > www/icon.png; fi
          ls -la www

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Strip plugin declarations
        run: |
          sed -i '/<plugin name=/d' config.xml
          echo "剩余插件声明: $(grep -c '<plugin name=' config.xml || true)"

      - name: Add Android platform
        run: cordova platform add android

      - name: Install plugins
        run: |
          cordova plugin add cordova-plugin-local-notification
          cordova plugin add cordova-plugin-file@^8.0.0
          cordova plugin add cordova-plugin-media@^7.0.0 --force
          cordova plugin add https://github.com/latchuk/cordova-plugin-saf-mediastore.git

      - name: Dedupe duplicate permissions
        run: |
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            python3 - "$MANIFEST" <<'EOF'
import sys, re
path = sys.argv[1]
text = open(path, encoding='utf-8').read()
seen = set()
def repl(m):
    name = m.group(1)
    if name in seen:
        return ''
    seen.add(name)
    return m.group(0)
open(path, 'w', encoding='utf-8').write(re.sub(r'<uses-permission android:name="([^"]+)"[^>]*/>', repl, text))
print("权限去重完成")
EOF
          fi

      - name: Build Debug APK
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suijia-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
